<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="inabangaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#086b3c" />
      <stop offset="100%" stop-color="#022e18" />
    </linearGradient>
    <linearGradient id="inabangaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#034975" />
    </linearGradient>
    <linearGradient id="inabangaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="64" cy="64" r="61" fill="#ffffff" stroke="#f59e0b" stroke-width="4" filter="url(#badgeShadow)" />
  
  <!-- Outer Dark Rope / Border -->
  <circle cx="64" cy="64" r="56" fill="#0f172a" />
  
  <!-- 50 Stars Circle (Golden Dotted Ring) -->
  <circle cx="64" cy="64" r="51" fill="none" stroke="#fde047" stroke-width="2.5" stroke-dasharray="2.5 4" opacity="0.95" />

  <!-- Inner Center Disc -->
  <circle cx="64" cy="64" r="45" fill="url(#inabangaGreen)" />

  <!-- Sky & Golden Rising Sun -->
  <g transform="translate(64, 46)">
    <!-- Central Sun Core -->
    <circle cx="0" cy="0" r="10" fill="url(#inabangaGold)" />
    <!-- Rays -->
    <path d="M0 -15 L0 -11" stroke="#fde047" stroke-width="2.2" stroke-linecap="round" />
    <path d="M10 -10 L7 -7" stroke="#fde047" stroke-width="2.2" stroke-linecap="round" />
    <path d="M15 0 L11 0" stroke="#fde047" stroke-width="2.2" stroke-linecap="round" />
    <path d="M10 10 L7 7" stroke="#fde047" stroke-width="2.2" stroke-linecap="round" />
    <path d="M0 15 L0 11" stroke="#fde047" stroke-width="2.2" stroke-linecap="round" />
    <path d="-10 10 L-7 7" stroke="#fde047" stroke-width="2.2" stroke-linecap="round" />
    <path d="-15 0 L-11 0" stroke="#fde047" stroke-width="2.2" stroke-linecap="round" />
    <path d="-10 -10 L-7 -7" stroke="#fde047" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Marine Waters / River Delta Base (Blue) -->
  <path d="M22,76 Q42,66 64,72 T106,75 L106,104 Q64,115 22,104 Z" fill="url(#inabangaBlue)" />

  <!-- Agriculture & Raffia Palms (Green Wave) -->
  <path d="M24,84 Q44,76 64,81 T104,83 L104,106 Q64,115 24,106 Z" fill="#15803d" />

  <!-- Stylized River Woven Band (White) -->
  <path d="M30,89 Q64,82 98,88" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 2" fill="none" opacity="0.9" />

  <!-- Central Red Heart/Shield with White Cross (Inabanga Heritage Motif) -->
  <g transform="translate(64, 60)">
    <path d="M-10,-5 Q-14,-12 -6,-14 Q0,-12 0,-5 Q0,-12 6,-14 Q14,-12 10,-5 Q6,4 0,10 Q-6,4 -10,-5 Z" fill="#dc2626" stroke="#ffffff" stroke-width="1.2" />
    <!-- White Cross -->
    <path d="M0,-10 L0,2 M-4,-6 L4,-6" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
  </g>
</svg>
