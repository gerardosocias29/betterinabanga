<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#086b3c" />
      <stop offset="100%" stop-color="#032d17" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left Emblem Group -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle with gold rim -->
    <circle cx="55" cy="55" r="52" fill="#ffffff" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)" />
    <!-- Inner Green Disc -->
    <circle cx="55" cy="55" r="46" fill="url(#greenGrad)" />
    
    <!-- 50 Stars Ring (stylized ring of golden dots) -->
    <circle cx="55" cy="55" r="42" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="2 3.5" opacity="0.85" />
    
    <!-- Sun Rays from SHINE INABANGA motif -->
    <g transform="translate(55, 42)">
      <!-- Central Sun Core -->
      <circle cx="0" cy="0" r="11" fill="url(#goldGrad)" />
      <!-- Sun Rays -->
      <path d="M0 -17 L0 -13" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
      <path d="M12 -12 L9 -9" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
      <path d="M17 0 L13 0" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
      <path d="M12 12 L9 9" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
      <path d="M0 17 L0 13" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
      <path d="-12 12 L-9 9" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
      <path d="-17 0 L-13 0" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
      <path d="-12 -12 L-9 -9" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Inabanga Map Outline Silhouette / Rolling Coastal Waves (Green and Blue/White base) -->
    <path d="M25,75 Q40,64 55,70 T85,73 L85,92 Q55,98 25,92 Z" fill="#22c55e" opacity="0.9" />
    <path d="M22,81 Q38,72 55,77 T88,78 L88,96 Q55,102 22,96 Z" fill="#032d17" />
    <!-- White woven tikog line accent -->
    <path d="M30,86 Q55,80 80,85" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2" fill="none" opacity="0.8" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(132, 18)">
    <!-- "BETTER" Text -->
    <text x="0" y="42" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#0f172a" letter-spacing="-1">
      BETTER
    </text>

    <!-- "INABANGA" Text in Rich Forest Green -->
    <text x="156" y="42" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#086b3c" letter-spacing="-1">
      INABANGA
    </text>

    <!-- Rising Sun over the first 'A' or 'I' in Inabanga (SHINE INABANGA motif) -->
    <g transform="translate(152, 6)">
      <circle cx="9" cy="0" r="4.5" fill="url(#goldGrad)" />
      <!-- Tiny rays -->
      <path d="M9 -7 L9 -5.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" />
      <path d="M14 -4 L12.5 -2.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" />
      <path d="M4 -4 L5.5 -2.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Subtitle Bar -->
    <rect x="0" y="56" width="395" height="1.5" fill="#e2e8f0" />
    
    <text x="1" y="74" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#043e23" letter-spacing="2.5">
      MUNICIPALITY OF INABANGA &bull; BOHOL
    </text>
    
    <text x="1" y="90" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#64748b" letter-spacing="1">
      CIVIC TRANSPARENCY &amp; PUBLIC SERVICES PORTAL
    </text>
  </g>
</svg>
